<text x="912" y="178" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700" fill="#38BDF8">WHY DOUBLE DESCENT?</text>
<text x="912" y="208" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8">• Red solid: Test Risk</text>
<text x="912" y="229" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8">• Green dashed: Train Risk</text>
<text x="912" y="250" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8"></text>
<text x="912" y="271" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8">At the threshold (N ≈ P),</text>
<text x="912" y="292" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8">only ONE fragile function</text>
<text x="912" y="313" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8">fits training noise — causing</text>
<text x="912" y="334" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8">wild variance spikes.</text>
<text x="912" y="355" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8"></text>
<text x="912" y="376" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8">Far past threshold (P &gt;&gt; N),</text>
<text x="912" y="397" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8">countless solutions fit the</text>
<text x="912" y="418" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8">data; SGD + weight decay</text>
<text x="912" y="439" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8">implicitly select the</text>
<text x="912" y="460" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8">smoothest, minimum-norm</text>
<text x="912" y="481" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8">interpolator (Belkin 2019;</text>
<text x="912" y="502" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8">Nakkiran et al. 2020).</text>
