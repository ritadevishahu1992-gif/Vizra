<text x="346" y="486" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8">Penalty: λ Σ wᵢ²</text>
<text x="346" y="508" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8">Prevents single-feature</text>
<text x="346" y="530" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8">dominance; decoupled in</text>
<text x="346" y="552" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8">AdamW for deep nets.</text>
