<text x="600" y="586" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8">No model—regardless of parameter count or training compute—can push expected generalization error below irreducible observation noise σ².</text>
