<text x="787.4749457157035" y="181" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="700" fill="#34D399">COMPUTE BOUND</text>
<circle cx="264.0" cy="456.1" r="8" fill="#EB3B2D" stroke="#090b10" stroke-width="2"/>
<text x="278.0" y="446.05882494628986" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700" fill="#EB3B2D">LLM Token Decode (Batch=1)</text>
<text x="278.0" y="464.05882494628986" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">Streams all weights per token → BW-limited!</text>
<circle cx="752.3" cy="200.7" r="8" fill="#34D399" stroke="#090b10" stroke-width="2"/>
<text x="738.2578993737756" y="226.71160121408525" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700" fill="#34D399">Prompt Prefill &amp; CNNs</text>
<text x="738.2578993737756" y="244.71160121408525" text-anchor="end" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">High weight reuse → Saturates NPU</text>
<text x="480.0" y="611" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#f1f5f9">Arithmetic Intensity (Operations per Byte Moved — Log₂ Scale)</text>
<text x="58" y="355.0" transform="rotate(-90 58 355.0)" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600" fill="#f1f5f9">Attainable Performance (TOPS — Log₁₀)</text>
<rect x="865" y="145" width="287" height="420" rx="12" fill="#111520" stroke="#242c3e" stroke-width="1.4"/>
<text x="885" y="178" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700" fill="#F59E0B">WHY QUANTIZATION WINS</text>
<text x="885" y="208" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8">Decode speed formula:</text>
<text x="885" y="229" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8">tok/s ≈ BW / Model_Bytes</text>
<text x="885" y="250" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8"></text>
<text x="885" y="271" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8">Example: 7B LLM on</text>
<text x="885" y="292" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8">100 GB/s mobile LPDDR5x:</text>
<text x="885" y="313" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8">• FP16 (14 GB): ~7 tok/s</text>
<text x="885" y="334" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8">• INT8 (7 GB):  ~14 tok/s</text>
<text x="885" y="355" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8">• INT4 (3.5 GB): ~28 tok/s</text>
<text x="885" y="376" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8"></text>
<text x="885" y="397" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8">Halving weight bit-width</text>
<text x="885" y="418" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8">nearly DOUBLES token</text>
<text x="885" y="439" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8">generation speed AND cuts</text>
<text x="885" y="460" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8">DRAM energy per token by</text>
<text x="885" y="481" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8">up to 4× — even before</text>
<text x="885" y="502" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8">faster NPU math kicks in.</text>
