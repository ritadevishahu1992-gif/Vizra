  <text x="48" y="88" font-family="Inter,system-ui,sans-serif" font-size="14" fill="#94a3b8">How Apple Neural Engine, Qualcomm Hexagon, and mobile NPUs coordinate sensors, on-chip SRAM, and unified LPDDR5x</text>
