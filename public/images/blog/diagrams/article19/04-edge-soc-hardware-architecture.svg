<text x="980" y="214" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" font-weight="700" fill="#EB3B2D">NEURAL ENGINE / NPU</text>
<rect x="856" y="234" width="248" height="56" rx="6" fill="#2a1417" stroke="#EB3B2D" stroke-width="1.4"/>
<text x="980" y="258" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="700" fill="#f1f5f9">INT4 / INT8 Systolic MAC Array</text>
<text x="980" y="278" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="600" fill="#F59E0B">35–80+ TOPS @ 3–6 Watts</text>
<rect x="856" y="306" width="248" height="72" rx="6" fill="#0f2c22" stroke="#34D399" stroke-width="1.4"/>
<text x="980" y="332" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="700" fill="#34D399">Dedicated On-Chip SRAM</text>
<text x="980" y="354" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">8–32 MB scratchpad avoids</text>
<text x="980" y="370" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">costly DRAM round-trips</text>
<line x1="179" y1="400" x2="179" y2="452" stroke="#38BDF8" stroke-width="2.4" marker-end="url(#arrCyan)" marker-start="url(#arrCyan)"/>
<line x1="424" y1="400" x2="424" y2="452" stroke="#38BDF8" stroke-width="2.4" marker-end="url(#arrCyan)" marker-start="url(#arrCyan)"/>
<line x1="684" y1="400" x2="684" y2="452" stroke="#38BDF8" stroke-width="2.4" marker-end="url(#arrCyan)" marker-start="url(#arrCyan)"/>
<line x1="980" y1="400" x2="980" y2="452" stroke="#38BDF8" stroke-width="2.4" marker-end="url(#arrCyan)" marker-start="url(#arrCyan)"/>
<rect x="74" y="458" width="1052" height="122" rx="12" fill="#0e1a26" stroke="#38BDF8" stroke-width="1.6"/>
<text x="600" y="492" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13.5" font-weight="700" fill="#38BDF8">UNIFIED MEMORY FABRIC  ·  LPDDR5x / HBM (100–546 GB/s SHARED POOL)</text>
<text x="600" y="524" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#f1f5f9">CPU, GPU, ISP, and NPU access identical physical pointers — eliminating PCIe host-to-device memory copies</text>
<text x="600" y="550" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8">Direct DMA streaming keeps battery draw under thermal throttling ceilings (~40°C skin temperature).</text>
