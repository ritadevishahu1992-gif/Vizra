<text x="424" y="334" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8">Scalar Branch Logic</text>
<text x="424" y="362" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8">Low-Latency Dispatch</text>
<rect x="564" y="184" width="240" height="214" rx="10" fill="#161b28" stroke="#A78BFA" stroke-width="1.4"/>
<text x="684" y="214" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="700" fill="#A78BFA">INTEGRATED GPU</text>
<text x="684" y="250" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8">Graphics &amp; UI Render</text>
<text x="684" y="278" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8">FP16 / BF16 Shaders</text>
<text x="684" y="306" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8">Metal / Vulkan Compute</text>
<text x="684" y="334" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8">Flexible Custom Ops</text>
