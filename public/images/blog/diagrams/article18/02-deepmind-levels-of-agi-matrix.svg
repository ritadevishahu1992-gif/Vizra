<text x="328" y="507" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8">≥99th percentile skilled adult</text>
<rect x="697" y="472" width="455" height="60" rx="8" fill="#111520" stroke="#242c3e" stroke-width="1.2"/>
<text x="715" y="507" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8">Narrow: Deep Blue, AlphaGo · General: Not yet achieved</text>
<rect x="48" y="543" width="250" height="60" rx="8" fill="#111520" stroke="#EB3B2D" stroke-width="1.4"/>
