<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Four Structural Engineering Gaps Separating LLMs from AGI">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2030" stroke-width="0.8" opacity="0.55"/>
    </pattern>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0e15"/>
      <stop offset="100%" stop-color="#07090e"/>
    </linearGradient>
    <marker id="arrCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EB3B2D"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34D399"/>
    </marker>
    <marker id="arrMuted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrViolet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#A78BFA"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <rect x="0" y="0" width="1200" height="3" fill="#EB3B2D"/>
  <text x="48" y="38" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="600" letter-spacing="2" fill="#EB3B2D">FIG 18.4  ·  VIZRA TECHNICAL EDITORIAL</text>
  <text x="48" y="66" font-family="Inter,system-ui,sans-serif" font-size="22" font-weight="700" fill="#f1f5f9">Four Structural Engineering Gaps Separating LLMs from AGI</text>
  <text x="48" y="88" font-family="Inter,system-ui,sans-serif" font-size="14" fill="#94a3b8">Fundamental architectural deficits that pure next-token scaling has not yet solved</text>
  <line x1="48" y1="104" x2="1152" y2="104" stroke="#242c3e" stroke-width="1"/>

<rect x="48" y="132" width="540" height="222" rx="12" fill="#111520" stroke="#38BDF8" stroke-width="1.5"/>
<text x="72" y="168" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="700" fill="#38BDF8">01 · CONTINUAL ON-THE-FLY LEARNING</text>
<text x="72" y="194" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#f1f5f9">Frozen weights after training</text>
<line x1="72" y1="210" x2="564" y2="210" stroke="#242c3e"/>
<text x="72" y="238" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12.2" font-weight="400" fill="#94a3b8">Humans learn a new skill in minutes without forgetting prior</text>
<text x="72" y="257" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12.2" font-weight="400" fill="#94a3b8">knowledge.</text>
<text x="72" y="292" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12.2" font-weight="400" fill="#94a3b8">Neural nets suffer catastrophic forgetting and rely on</text>
<text x="72" y="311" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12.2" font-weight="400" fill="#94a3b8">transient context windows.</text>
<rect x="612" y="132" width="540" height="222" rx="12" fill="#111520" stroke="#A78BFA" stroke-width="1.5"/>
<text x="636" y="168" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="700" fill="#A78BFA">02 · CAUSAL WORLD MODELS &amp; PHYSICS</text>
<text x="636" y="194" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#f1f5f9">Statistical correlation ≠ physical causality</text>
<line x1="636" y1="210" x2="1128" y2="210" stroke="#242c3e"/>
<text x="636" y="238" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12.2" font-weight="400" fill="#94a3b8">Next-token prediction captures linguistic patterns but lacks</text>
<text x="636" y="257" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12.2" font-weight="400" fill="#94a3b8">grounded intuitive physics.</text>
<text x="636" y="292" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12.2" font-weight="400" fill="#94a3b8">Fails under novel counterfactual interventions outside</text>
<text x="636" y="311" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12.2" font-weight="400" fill="#94a3b8">training distributions.</text>
<rect x="48" y="378" width="540" height="222" rx="12" fill="#111520" stroke="#F59E0B" stroke-width="1.5"/>
<text x="72" y="414" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="700" fill="#F59E0B">03 · RELIABLE LONG-HORIZON AGENCY</text>
<text x="72" y="440" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#f1f5f9">Compounding error over 100+ steps</text>
<line x1="72" y1="456" x2="564" y2="456" stroke="#242c3e"/>
<text x="72" y="484" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12.2" font-weight="400" fill="#94a3b8">Even 98% per-step accuracy collapses to 0.98¹⁰⁰ = 13%</text>
<text x="72" y="503" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12.2" font-weight="400" fill="#94a3b8">reliability over 100 steps.</text>
<text x="72" y="538" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12.2" font-weight="400" fill="#94a3b8">Requires formal state verification, rollback, and</text>
<text x="72" y="557" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12.2" font-weight="400" fill="#94a3b8">hierarchical subgoal planning.</text>
<rect x="612" y="378" width="540" height="222" rx="12" fill="#111520" stroke="#EB3B2D" stroke-width="1.5"/>
<text x="636" y="414" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="700" fill="#EB3B2D">04 · EMBODIED SENSORIMOTOR GROUNDING</text>
<text x="636" y="440" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#f1f5f9">Moravec's Paradox in the physical world</text>
<line x1="636" y1="456" x2="1128" y2="456" stroke="#242c3e"/>
<text x="636" y="484" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12.2" font-weight="400" fill="#94a3b8">High-level reasoning is computationally cheap; tactile</text>
<text x="636" y="503" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12.2" font-weight="400" fill="#94a3b8">dexterity is immensely hard.</text>
<text x="636" y="538" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12.2" font-weight="400" fill="#94a3b8">Real-world robotics lacks internet-scale physical</text>
<text x="636" y="557" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12.2" font-weight="400" fill="#94a3b8">interaction trajectories.</text>
  <line x1="48" y1="636" x2="1152" y2="636" stroke="#242c3e" stroke-width="1"/>
  <text x="48" y="657" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#64748b">Fig. 18.4 — Four architectural gaps toward AGI</text>
  <text x="1152" y="657" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#64748b">vizra.vercel.app/blog</text>
</svg>