<text x="68" y="174" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="600" fill="#f1f5f9">CURRENT REALITY (100% DEPLOYED)</text>
<text x="68" y="208" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="700" fill="#34D399">SCOPE</text>
<text x="68" y="228" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#f1f5f9">Single or bounded task families</text>
