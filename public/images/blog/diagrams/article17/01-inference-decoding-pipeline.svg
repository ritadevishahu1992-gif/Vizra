<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="End-to-End AI Inference &amp; Prediction Pipeline">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2030" stroke-width="0.8" opacity="0.55"/>
    </pattern>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0e15"/>
      <stop offset="100%" stop-color="#07090e"/>
    </linearGradient>
    <marker id="arrCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EB3B2D"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34D399"/>
    </marker>
    <marker id="arrMuted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrViolet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#A78BFA"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <rect x="0" y="0" width="1200" height="3" fill="#EB3B2D"/>
  <text x="48" y="38" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="600" letter-spacing="2" fill="#EB3B2D">FIG 17.1  ·  VIZRA TECHNICAL EDITORIAL</text>
  <text x="48" y="66" font-family="Inter,system-ui,sans-serif" font-size="22" font-weight="700" fill="#f1f5f9">End-to-End AI Inference &amp; Prediction Pipeline</text>
  <text x="48" y="88" font-family="Inter,system-ui,sans-serif" font-size="14" fill="#94a3b8">From raw input representation through neural logits to discriminative decision thresholds vs. autoregressive token sampling</text>
  <line x1="48" y1="104" x2="1152" y2="104" stroke="#242c3e" stroke-width="1"/>

<rect x="48" y="286" width="195" height="130" rx="12" fill="#111520" stroke="#38BDF8" stroke-width="1.5"/>
<text x="145" y="322" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="700" fill="#38BDF8">1. INPUT ENCODING</text>
<text x="145" y="350" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8">Tokenize / Normalize</text>
<text x="145" y="372" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8">Feature Embedding</text>
<text x="145" y="394" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8">KV Cache Prefill</text>
<line x1="245" y1="351" x2="294" y2="351" stroke="#38BDF8" stroke-width="2.2" marker-end="url(#arrCyan)"/>
<rect x="300" y="286" width="210" height="130" rx="12" fill="#111520" stroke="#A78BFA" stroke-width="1.5"/>
<text x="405" y="322" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="700" fill="#A78BFA">2. FORWARD PASS</text>
<text x="405" y="350" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8">Frozen Weights θ*</text>
<text x="405" y="372" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8">No Backpropagation</text>
<text x="405" y="394" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8">Raw Logits z ∈ ℝᵛ</text>
<path d="M 512 325 C 555 325, 555 218, 602 218" fill="none" stroke="#34D399" stroke-width="2.2" marker-end="url(#arrGreen)"/>
<rect x="608" y="138" width="544" height="178" rx="12" fill="#111520" stroke="#34D399" stroke-width="1.5"/>
<text x="630" y="168" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700" fill="#34D399">TRACK A · DISCRIMINATIVE CLASSIFICATION / REGRESSION</text>
<rect x="630" y="188" width="152" height="98" rx="8" fill="#161b28" stroke="#242c3e" stroke-width="1.4"/>
<text x="706" y="218" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="700" fill="#f1f5f9">Sigmoid / Softmax</text>
<text x="706" y="244" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#34D399">Calibrated Prob p̂</text>
<text x="706" y="266" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#94a3b8">(Temp Scaling T)</text>
<line x1="784" y1="237" x2="816" y2="237" stroke="#34D399" stroke-width="2" marker-end="url(#arrGreen)"/>
<rect x="822" y="188" width="146" height="98" rx="8" fill="#161b28" stroke="#242c3e" stroke-width="1.4"/>
<text x="895" y="218" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="700" fill="#F59E0B">Threshold τ</text>
<text x="895" y="244" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8">Cost-aware cutoff</text>
<text x="895" y="266" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="600" fill="#f1f5f9">p̂ ≥ τ → Positive</text>
<line x1="970" y1="237" x2="998" y2="237" stroke="#34D399" stroke-width="2" marker-end="url(#arrGreen)"/>
<rect x="1004" y="188" width="128" height="98" rx="8" fill="#0f2c22" stroke="#34D399" stroke-width="1.2"/>
<text x="1068" y="224" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700" fill="#34D399">DECISION</text>
<text x="1068" y="252" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="500" fill="#f1f5f9">Fraud / Triage</text>
<path d="M 512 377 C 555 377, 555 478, 602 478" fill="none" stroke="#EB3B2D" stroke-width="2.2" marker-end="url(#arrRed)"/>
<rect x="608" y="360" width="544" height="244" rx="12" fill="#111520" stroke="#EB3B2D" stroke-width="1.5"/>
<text x="630" y="390" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700" fill="#EB3B2D">TRACK B · AUTOREGRESSIVE GENERATIVE DECODING LOOP</text>
<rect x="630" y="412" width="152" height="98" rx="8" fill="#161b28" stroke="#242c3e" stroke-width="1.4"/>
<text x="706" y="442" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="700" fill="#f1f5f9">Temp + Softmax</text>
<text x="706" y="468" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="600" fill="#38BDF8">pᵢ ∝ exp(zᵢ / T)</text>
<text x="706" y="490" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#94a3b8">Vocab 128K tokens</text>
<line x1="784" y1="461" x2="816" y2="461" stroke="#EB3B2D" stroke-width="2" marker-end="url(#arrRed)"/>
<rect x="822" y="412" width="146" height="98" rx="8" fill="#161b28" stroke="#242c3e" stroke-width="1.4"/>
<text x="895" y="442" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="700" fill="#F59E0B">Filter &amp; Sample</text>
<text x="895" y="468" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="600" fill="#f1f5f9">Top-k / Top-p / Min-p</text>
<text x="895" y="490" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">Sample token yₜ</text>
<line x1="970" y1="461" x2="998" y2="461" stroke="#EB3B2D" stroke-width="2" marker-end="url(#arrRed)"/>
<rect x="1004" y="412" width="128" height="98" rx="8" fill="#2a1417" stroke="#EB3B2D" stroke-width="1.2"/>
<text x="1068" y="446" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700" fill="#EB3B2D">APPEND yₜ</text>
<text x="1068" y="472" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="500" fill="#f1f5f9">Update KV Cache</text>
<path d="M 1068 512 L 1068 564 L 706 564 L 706 516" fill="none" stroke="#EB3B2D" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrRed)"/>
<text x="887" y="586" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="600" fill="#EB3B2D">Repeat token-by-token until &lt;EOS&gt; or max_tokens reached</text>
  <line x1="48" y1="636" x2="1152" y2="636" stroke="#242c3e" stroke-width="1"/>
  <text x="48" y="657" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#64748b">Fig. 17.1 — Discriminative vs. generative inference pipeline</text>
  <text x="1152" y="657" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#64748b">vizra.vercel.app/blog</text>
</svg>