<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Anatomy of a Transformer Block: 2017 Baseline vs. Modern LLM">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2030" stroke-width="0.8" opacity="0.55"/>
    </pattern>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0e15"/>
      <stop offset="100%" stop-color="#07090e"/>
    </linearGradient>
    <marker id="arrCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EB3B2D"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34D399"/>
    </marker>
    <marker id="arrMuted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrViolet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#A78BFA"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <rect x="0" y="0" width="1200" height="3" fill="#EB3B2D"/>
  <text x="48" y="38" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="600" letter-spacing="2" fill="#EB3B2D">FIG 16.3  ·  VIZRA TECHNICAL EDITORIAL</text>
  <text x="48" y="66" font-family="Inter,system-ui,sans-serif" font-size="22" font-weight="700" fill="#f1f5f9">Anatomy of a Transformer Block: 2017 Baseline vs. Modern LLM</text>
  <text x="48" y="88" font-family="Inter,system-ui,sans-serif" font-size="14" fill="#94a3b8">Evolution from Vaswani et al. (2017) Post-LN + ReLU to Pre-LN RMSNorm + RoPE + GQA + SwiGLU</text>
  <line x1="48" y1="104" x2="1152" y2="104" stroke="#242c3e" stroke-width="1"/>

<rect x="48" y="128" width="536" height="480" rx="12" fill="#111520" stroke="#F59E0B" stroke-width="1.4"/>
<text x="72" y="160" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700" fill="#F59E0B">2017 VASWANI BLOCK (POST-LN · ReLU · SINUSOIDAL)</text>
<rect x="86" y="192" width="460" height="50" rx="8" fill="#161b28" stroke="#242c3e" stroke-width="1.3"/>
<text x="316" y="222" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#f1f5f9">Input + Sinusoidal Positional Encoding</text>
<line x1="316" y1="242" x2="316" y2="264" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrMuted)"/>
<rect x="86" y="266" width="460" height="50" rx="8" fill="#161b28" stroke="#F59E0B" stroke-width="1.3"/>
<text x="316" y="296" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#F59E0B">Multi-Head Attention (MHA — full KV per head)</text>
<line x1="316" y1="316" x2="316" y2="338" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrMuted)"/>
<rect x="86" y="340" width="460" height="50" rx="8" fill="#161b28" stroke="#EB3B2D" stroke-width="1.3"/>
<text x="316" y="370" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#EB3B2D">Residual Add → Post-LayerNorm</text>
<line x1="316" y1="390" x2="316" y2="412" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrMuted)"/>
<rect x="86" y="414" width="460" height="50" rx="8" fill="#161b28" stroke="#A78BFA" stroke-width="1.3"/>
<text x="316" y="444" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#A78BFA">Position-wise FFN (Linear → ReLU → Linear)</text>
<line x1="316" y1="464" x2="316" y2="486" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrMuted)"/>
<rect x="86" y="488" width="460" height="50" rx="8" fill="#161b28" stroke="#EB3B2D" stroke-width="1.3"/>
<text x="316" y="518" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#EB3B2D">Residual Add → Post-LayerNorm → Output</text>
<text x="316" y="586" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#94a3b8">Post-LN requires careful LR warmup; MHA KV cache scales linearly with heads</text>
<rect x="616" y="128" width="536" height="480" rx="12" fill="#111520" stroke="#38BDF8" stroke-width="1.4"/>
<text x="640" y="160" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700" fill="#38BDF8">MODERN LLM BLOCK (LLAMA 3 / DEEPSEEK / GEMMA)</text>
<rect x="654" y="192" width="460" height="50" rx="8" fill="#161b28" stroke="#34D399" stroke-width="1.3"/>
<text x="884" y="222" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#34D399">Input Residual Stream x (unnormalized highway)</text>
<line x1="884" y1="242" x2="884" y2="264" stroke="#38BDF8" stroke-width="1.8" marker-end="url(#arrCyan)"/>
<rect x="654" y="266" width="460" height="50" rx="8" fill="#161b28" stroke="#38BDF8" stroke-width="1.3"/>
<text x="884" y="296" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#38BDF8">Pre-RMSNorm (no mean centering, faster fused kernel)</text>
<line x1="884" y1="316" x2="884" y2="338" stroke="#38BDF8" stroke-width="1.8" marker-end="url(#arrCyan)"/>
<rect x="654" y="340" width="460" height="50" rx="8" fill="#161b28" stroke="#38BDF8" stroke-width="1.3"/>
<text x="884" y="370" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#f1f5f9">Grouped-Query Attention (GQA) + RoPE Rotary Angles</text>
<line x1="884" y1="390" x2="884" y2="412" stroke="#38BDF8" stroke-width="1.8" marker-end="url(#arrCyan)"/>
<rect x="654" y="414" width="460" height="50" rx="8" fill="#161b28" stroke="#34D399" stroke-width="1.3"/>
<text x="884" y="444" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#34D399">Residual Add → Pre-RMSNorm</text>
<line x1="884" y1="464" x2="884" y2="486" stroke="#38BDF8" stroke-width="1.8" marker-end="url(#arrCyan)"/>
<rect x="654" y="488" width="460" height="50" rx="8" fill="#161b28" stroke="#A78BFA" stroke-width="1.3"/>
<text x="884" y="518" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#A78BFA">SwiGLU Gated MLP (SiLU(xW₁) ⊙ xW₃)W₂ + Residual Add</text>
<text x="884" y="586" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#38BDF8">Pre-RMSNorm stabilizes 100+ layer gradients; GQA cuts KV cache 4×–8×</text>
  <line x1="48" y1="636" x2="1152" y2="636" stroke="#242c3e" stroke-width="1"/>
  <text x="48" y="657" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#64748b">Fig. 16.3 — 2017 Transformer vs. modern LLM block</text>
  <text x="1152" y="657" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#64748b">vizra.vercel.app/blog</text>
</svg>