<text x="72" y="578" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#34D399">• Every token attends directly to every prior token in O(1) hops via single batched GEMM (QKᵀ) — saturates GPU tensor cores</text>
