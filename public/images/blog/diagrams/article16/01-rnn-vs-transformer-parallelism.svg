<text x="72" y="286" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8">• Path length between token 1 and token n is O(n) → vanishing long-range memory &amp; fixed-vector bottleneck</text>
<text x="72" y="312" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#F59E0B">• Token h₆ MUST wait for h₁→h₂→h₃→h₄→h₅ → cannot parallelize across sequence dimension on GPUs</text>
