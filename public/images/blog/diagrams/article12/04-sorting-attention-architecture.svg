<text x="358" y="400" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="600" fill="#f1f5f9">swap</text>
<rect x="430" y="378" width="96" height="36" rx="7" fill="#161b28" stroke="#F59E0B" stroke-width="1.1"/>
<text x="478" y="400" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="600" fill="#f1f5f9">return</text>
<rect x="72" y="456" width="472" height="126" rx="10" fill="#161b28" stroke="#242c3e" stroke-width="1.4"/>
<text x="90" y="482" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8">• High instruction-level latency sensitivity</text>
<text x="90" y="507" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8">• Branch mispredictions flush deep CPU pipelines</text>
<text x="90" y="532" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8">• Exact mathematical guarantees &amp; O(n log n) bounds</text>
<text x="90" y="557" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8">• Dominant in OS kernels, databases, routing &amp; compilers</text>
<rect x="632" y="130" width="520" height="475" rx="12" fill="#111520" stroke="#38BDF8" stroke-width="1.4"/>
<text x="656" y="162" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700" fill="#38BDF8">ACCELERATOR TENSOR OPERATORS (e.g. ATTENTION)</text>
<text x="656" y="184" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8">Zero data-dependent branches; thousands of fused MACs per cycle</text>
<rect x="666" y="238" width="90" height="90" rx="6" fill="#10283a" stroke="#38BDF8" stroke-width="1.3"/>
