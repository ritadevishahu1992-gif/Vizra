<text x="892" y="410" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700" fill="#38BDF8">FP8 / BF16 Systolic Tensor Cores → 989–2,000+ TFLOPS/GPU</text>
<rect x="656" y="456" width="472" height="126" rx="10" fill="#161b28" stroke="#242c3e" stroke-width="1.4"/>
<text x="674" y="482" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8">• Uniform SIMD / SIMT memory access (FlashAttention)</text>
<text x="674" y="507" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8">• Bottlenecked by HBM memory bandwidth, not branches</text>
<text x="674" y="532" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8">• Differentiable end-to-end via reverse-mode autodiff</text>
<text x="674" y="557" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8">• Powers LLMs, diffusion models &amp; neural surrogates</text>
