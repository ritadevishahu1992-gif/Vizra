  <text x="48" y="66" font-family="Inter,system-ui,sans-serif" font-size="22" font-weight="700" fill="#f1f5f9">Sequential Control-Flow Algorithms vs. Parallel Tensor Operators</text>
  <text x="48" y="88" font-family="Inter,system-ui,sans-serif" font-size="14" fill="#94a3b8">Why modern AI workloads shifted from branch-heavy CPU comparisons to dense GPU matrix multiplications</text>
