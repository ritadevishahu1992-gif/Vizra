<rect x="48" y="130" width="1104" height="48" rx="8" fill="#161b28" stroke="#242c3e" stroke-width="1.4"/>
<text x="64" y="160" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700" fill="#38BDF8">Method</text>
<text x="300" y="160" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700" fill="#38BDF8">Backward Pass?</text>
<text x="485" y="160" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700" fill="#38BDF8">Activation Memory</text>
<text x="700" y="160" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700" fill="#38BDF8">Biological Fit</text>
<text x="915" y="160" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700" fill="#38BDF8">Frontier Scale Fit</text>
<rect x="48" y="192" width="1104" height="72" rx="10" fill="#111520" stroke="#34D399" stroke-width="1.5"/>
<text x="64" y="233" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="13.5" font-weight="700" fill="#34D399">Reverse-Mode Backprop</text>
<text x="300" y="233" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#f1f5f9">Yes (weight transport)</text>
<text x="485" y="233" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" font-weight="400" fill="#94a3b8">O(L) / O(√L) ckpt</text>
<text x="700" y="233" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8">Low (non-local)</text>
<text x="915" y="233" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#34D399">Dominant (100% frontier)</text>
<rect x="48" y="276" width="1104" height="72" rx="10" fill="#111520" stroke="#242c3e" stroke-width="1"/>
<text x="64" y="317" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="13.5" font-weight="700" fill="#F59E0B">Forward-Forward (Hinton)</text>
<text x="300" y="317" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#f1f5f9">No (2 forward passes)</text>
<text x="485" y="317" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" font-weight="400" fill="#94a3b8">O(1) per layer</text>
<text x="700" y="317" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8">High (local goodness)</text>
<text x="915" y="317" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#F59E0B">Research / small vision</text>
<rect x="48" y="360" width="1104" height="72" rx="10" fill="#111520" stroke="#242c3e" stroke-width="1"/>
<text x="64" y="401" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="13.5" font-weight="700" fill="#A78BFA">Equilibrium Propagation</text>
<text x="300" y="401" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#f1f5f9">No (energy relaxation)</text>
<text x="485" y="401" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" font-weight="400" fill="#94a3b8">O(1) local state</text>
<text x="700" y="401" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8">High (analog physics)</text>
<text x="915" y="401" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#A78BFA">Analog / neuromorphic</text>
<rect x="48" y="444" width="1104" height="72" rx="10" fill="#111520" stroke="#242c3e" stroke-width="1"/>
<text x="64" y="485" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="13.5" font-weight="700" fill="#94a3b8">Direct Feedback Alignment</text>
<text x="300" y="485" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#f1f5f9">Random fixed matrix</text>
<text x="485" y="485" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" font-weight="400" fill="#94a3b8">O(L) cached</text>
<text x="700" y="485" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8">Moderate (no symmetry)</text>
<text x="915" y="485" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#94a3b8">Breaks down on deep CNNs</text>
<rect x="48" y="528" width="1104" height="72" rx="10" fill="#111520" stroke="#242c3e" stroke-width="1"/>
<text x="64" y="569" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="13.5" font-weight="700" fill="#38BDF8">Zeroth-Order (MeZO)</text>
<text x="300" y="569" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#f1f5f9">No (2 perturbations)</text>
<text x="485" y="569" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" font-weight="400" fill="#94a3b8">O(1) inference VRAM</text>
<text x="700" y="569" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8">Low</text>
<text x="915" y="569" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#38BDF8">Memory-bound LLM LoRA</text>
