<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Forward Primal Pass &amp; Reverse-Mode Backpropagation Graph">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2030" stroke-width="0.8" opacity="0.55"/>
    </pattern>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0e15"/>
      <stop offset="100%" stop-color="#07090e"/>
    </linearGradient>
    <marker id="arrCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EB3B2D"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34D399"/>
    </marker>
    <marker id="arrMuted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrViolet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#A78BFA"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <rect x="0" y="0" width="1200" height="3" fill="#EB3B2D"/>
  <text x="48" y="38" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="600" letter-spacing="2" fill="#EB3B2D">FIG 13.4  ·  VIZRA TECHNICAL EDITORIAL</text>
  <text x="48" y="66" font-family="Inter,system-ui,sans-serif" font-size="22" font-weight="700" fill="#f1f5f9">Forward Primal Pass &amp; Reverse-Mode Backpropagation Graph</text>
  <text x="48" y="88" font-family="Inter,system-ui,sans-serif" font-size="14" fill="#94a3b8">Worked single-neuron example: x=2.0, w=0.5, b=-0.5, target y=1.0, sigmoid activation &amp; squared-error loss</text>
  <line x1="48" y1="104" x2="1152" y2="104" stroke="#242c3e" stroke-width="1"/>

<rect x="38" y="273" width="144" height="104" rx="12" fill="#111520" stroke="#38BDF8" stroke-width="1.5"/>
<text x="110" y="299" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="700" fill="#38BDF8">Input</text>
<text x="110" y="327" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="600" fill="#f1f5f9">x = 2.0</text>
<text x="110" y="355" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" font-weight="700" fill="#34D399">w = 0.5</text>
<line x1="184" y1="303" x2="257" y2="303" stroke="#38BDF8" stroke-width="2.4" marker-end="url(#arrCyan)"/>
<line x1="261" y1="347" x2="188" y2="347" stroke="#F59E0B" stroke-width="2.4" marker-end="url(#arrAmber)"/>
<rect x="263" y="273" width="144" height="104" rx="12" fill="#111520" stroke="#38BDF8" stroke-width="1.5"/>
<text x="335" y="299" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="700" fill="#38BDF8">Multiply</text>
<text x="335" y="327" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="600" fill="#f1f5f9">u = w · x</text>
<text x="335" y="355" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" font-weight="700" fill="#34D399">u = 1.00</text>
<line x1="409" y1="303" x2="482" y2="303" stroke="#38BDF8" stroke-width="2.4" marker-end="url(#arrCyan)"/>
<line x1="486" y1="347" x2="413" y2="347" stroke="#F59E0B" stroke-width="2.4" marker-end="url(#arrAmber)"/>
<rect x="488" y="273" width="144" height="104" rx="12" fill="#111520" stroke="#38BDF8" stroke-width="1.5"/>
<text x="560" y="299" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="700" fill="#38BDF8">Add Bias</text>
<text x="560" y="327" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="600" fill="#f1f5f9">z = u + b</text>
<text x="560" y="355" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" font-weight="700" fill="#34D399">z = 0.50</text>
<line x1="634" y1="303" x2="707" y2="303" stroke="#38BDF8" stroke-width="2.4" marker-end="url(#arrCyan)"/>
<line x1="711" y1="347" x2="638" y2="347" stroke="#F59E0B" stroke-width="2.4" marker-end="url(#arrAmber)"/>
<rect x="713" y="273" width="144" height="104" rx="12" fill="#111520" stroke="#A78BFA" stroke-width="1.5"/>
<text x="785" y="299" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="700" fill="#A78BFA">Sigmoid σ(z)</text>
<text x="785" y="327" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="600" fill="#f1f5f9">ŷ = 1/(1+e⁻ᶻ)</text>
<text x="785" y="355" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" font-weight="700" fill="#34D399">ŷ = 0.6225</text>
<line x1="859" y1="303" x2="952" y2="303" stroke="#38BDF8" stroke-width="2.4" marker-end="url(#arrCyan)"/>
<line x1="956" y1="347" x2="863" y2="347" stroke="#F59E0B" stroke-width="2.4" marker-end="url(#arrAmber)"/>
<rect x="958" y="273" width="144" height="104" rx="12" fill="#111520" stroke="#EB3B2D" stroke-width="1.5"/>
<text x="1030" y="299" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="700" fill="#EB3B2D">MSE Loss</text>
<text x="1030" y="327" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="600" fill="#f1f5f9">L = ½(ŷ - y)²</text>
<text x="1030" y="355" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" font-weight="700" fill="#34D399">L = 0.0713</text>
<rect x="832" y="408" width="152" height="54" rx="8" fill="#241a0b" stroke="#F59E0B" stroke-width="1.1"/>
<text x="908" y="430" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="700" fill="#F59E0B">∂L/∂ŷ = ŷ - y</text>
<text x="908" y="450" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700" fill="#f1f5f9">= -0.3775</text>
<rect x="596" y="408" width="152" height="54" rx="8" fill="#241a0b" stroke="#F59E0B" stroke-width="1.1"/>
<text x="672" y="430" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="700" fill="#F59E0B">∂L/∂z = (ŷ-y)σ(1-σ)</text>
<text x="672" y="450" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700" fill="#f1f5f9">= -0.0887</text>
<rect x="372" y="408" width="152" height="54" rx="8" fill="#241a0b" stroke="#F59E0B" stroke-width="1.1"/>
<text x="448" y="430" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="700" fill="#F59E0B">∂L/∂u = ∂L/∂z · 1</text>
<text x="448" y="450" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700" fill="#f1f5f9">= -0.0887</text>
<rect x="146" y="408" width="152" height="54" rx="8" fill="#241a0b" stroke="#F59E0B" stroke-width="1.1"/>
<text x="222" y="430" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="700" fill="#F59E0B">∂L/∂w = ∂L/∂u · x</text>
<text x="222" y="450" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700" fill="#f1f5f9">= -0.1774</text>
<rect x="190" y="148" width="820" height="42" rx="8" fill="#0d202e" stroke="#38BDF8" stroke-width="1"/>
<text x="600" y="174" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" font-weight="700" fill="#38BDF8">FORWARD PASS (LEFT → RIGHT): Compute &amp; Cache Intermediate Activations (u, z, ŷ)</text>
<rect x="110" y="505" width="980" height="92" rx="10" fill="#161b28" stroke="#34D399" stroke-width="1.2"/>
<text x="136" y="535" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700" fill="#34D399">PARAMETER UPDATE STEP (LEARNING RATE η = 0.5)</text>
<text x="136" y="562" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="600" fill="#f1f5f9">w_new = w − η(∂L/∂w) = 0.5 − 0.5(−0.1774) = 0.5887      |      b_new = b − η(∂L/∂b) = −0.5 − 0.5(−0.0887) = −0.4556</text>
<text x="136" y="584" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8">Result: Updated prediction ŷ moves closer to target y = 1.0, reducing squared-error loss in a single reverse-mode pass.</text>
  <line x1="48" y1="636" x2="1152" y2="636" stroke="#242c3e" stroke-width="1"/>
  <text x="48" y="657" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#64748b">Fig. 13.4 — Forward primal and backward adjoint pass</text>
  <text x="1152" y="657" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#64748b">vizra.vercel.app/blog</text>
</svg>