<text x="348" y="344" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="700" fill="#38BDF8">Gradient Highway (I)</text>
<text x="348" y="376" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8">Even if ∂F/∂x is tiny,</text>
<text x="348" y="396" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8">gradients flow cleanly</text>
<text x="348" y="416" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8">across 100+ layers</text>
<text x="348" y="436" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8">without exponential</text>
<text x="348" y="456" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8">vanishing decay.</text>
