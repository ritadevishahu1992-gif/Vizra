<rect x="865" y="145" width="287" height="420" rx="12" fill="#111520" stroke="#242c3e" stroke-width="1.4"/>
<text x="885" y="178" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700" fill="#EB3B2D">KEY SCALING INSIGHTS</text>
<text x="885" y="208" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8">1. Training-Optimal Ratio:</text>
<text x="885" y="228" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8">Hoffmann et al. (2022) showed</text>
<text x="885" y="248" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8">equal scaling of N &amp; D at ~20</text>
<text x="885" y="268" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8">tokens/param minimizes loss</text>
<text x="885" y="288" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8">for a fixed training budget.</text>
<text x="885" y="308" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8"></text>
<text x="885" y="328" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8">2. Inference Economics:</text>
<text x="885" y="348" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8">Llama 3 8B trained on 15T</text>
<text x="885" y="368" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8">tokens (~1,875 tok/param —</text>
<text x="885" y="388" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8">94× overtrained) to slash</text>
<text x="885" y="408" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8">per-query serving costs.</text>
<text x="885" y="428" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8"></text>
<text x="885" y="448" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8">3. Frontier Ceiling:</text>
<text x="885" y="468" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8">Llama 3 405B reached ~3.8×10²⁵</text>
<text x="885" y="488" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8">FLOPs; DeepSeek-V3 used sparse</text>
<text x="885" y="508" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8">MoE (37B active) for 2.788M</text>
<text x="885" y="528" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="400" fill="#94a3b8">H800 GPU hours (~$5.58M).</text>
